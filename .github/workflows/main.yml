name: 构建

on:
  workflow_dispatch:

jobs:
  buildwin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        
      - name: Setup Go environment
        uses: actions/setup-go@v7.1.0
        with:
          go-version: 1.24.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v7.1.0

      - name: 安装交叉编译器
        run: sudo apt install gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: 构建
        run: CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC=x86-64-w64-mingw32-gcc CXX=x86-64-w64-mingw32-g++ make

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: houndd.exe
          path: .build/bin/houndd
      
